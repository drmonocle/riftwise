<!doctype html>
<!-- lolworlds.com/riftwise/move.html: hands this browser's RiftWise settings over to riftwise.gg.
     A browser keeps saved settings per site, so what was set up at lolworlds.com/riftwise doesn't show at
     riftwise.gg by itself. riftwise.gg's "Bring them over" button opens this page; it packs the settings into the
     address after "#" (which browsers never send to a server) and goes straight back. Sign-in and alerts are not
     carried over (they belong to the site). The list matches MOVE_KEYS in src/move.ts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RiftWise is moving to riftwise.gg</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0a1d;color:#efeaff;font:15px/1.5 system-ui,sans-serif;text-align:center;padding:24px}a{color:#b69cff}</style>
</head>
<body>
<p>Taking your settings to <a href="https://riftwise.gg/">riftwise.gg</a>…</p>
<script>
(function () {
  var keys = ["riftwatch_settings", "riftwatch_settings_updated", "riftwatch_revealed", "riftwatch_revealed_updated",
    "riftwatch_has_launched", "riftwatch_tip_hub_v1", "riftwatch_tip_rename_v1", "riftwatch_push_banner_closed"];
  var out = {}, n = 0;
  try {
    for (var i = 0; i < keys.length; i++) {
      var v = localStorage.getItem(keys[i]);
      if (v !== null) { out[keys[i]] = v; n++; }
    }
  } catch (e) {}
  var data = "none";
  if (n) {
    var bytes = new TextEncoder().encode(JSON.stringify(out)), bin = "";
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    data = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  location.replace("https://riftwise.gg/#import=" + data);
})();
</script>
</body>
</html>
