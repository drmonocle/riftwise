<!doctype html>
<!-- lolworlds.com/riftwise/move.html: hands this browser's RiftWise settings over to riftwise.gg.
     A browser keeps saved settings per site, so what was set up at lolworlds.com/riftwise doesn't show at
     riftwise.gg by itself. The first time a browser opens riftwise.gg, the app comes here (?to=<the page it was
     on>); this page packs the settings into the address after "#" (which browsers never send to a server) and goes
     straight back to that page. The list matches MOVE_KEYS in src/move.ts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RiftWise</title>
<style>body{margin:0;min-height:100vh;background:#0c0a1d}</style>
</head>
<body>
<script>
(function () {
  var keys = ["riftwatch_settings", "riftwatch_settings_updated", "riftwatch_revealed", "riftwatch_revealed_updated",
    "riftwatch_has_launched", "riftwatch_tip_hub_v1", "riftwatch_tip_rename_v1", "riftwatch_push_banner_closed",
    "riftwatch_sync_token", "riftwatch_sync_account", "riftwatch_sync_state", "riftwatch_sync_code"];
  var out = {}, n = 0;
  try {
    for (var i = 0; i < keys.length; i++) {
      var v = localStorage.getItem(keys[i]);
      if (v !== null) { out[keys[i]] = v; n++; }
    }
  } catch (e) {}
  var data = "none";
  if (n) {
    var bytes = new TextEncoder().encode(JSON.stringify(out)), bin = "";
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    data = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  // Back to the page the visitor was on, on riftwise.gg only
  var to = new URLSearchParams(location.search).get("to") || "/";
  var back;
  try {
    back = new URL(to, "https://riftwise.gg/");
    if (back.origin !== "https://riftwise.gg") back = new URL("https://riftwise.gg/");
  } catch (e) {
    back = new URL("https://riftwise.gg/");
  }
  location.replace("https://riftwise.gg" + back.pathname + back.search + "#import=" + data + "&h=" + encodeURIComponent(back.hash));
})();
</script>
<noscript><p style="color:#efeaff;font:15px system-ui;text-align:center;padding:24px">RiftWise is now at <a style="color:#b69cff" href="https://riftwise.gg/">riftwise.gg</a>.</p></noscript>
</body>
</html>
