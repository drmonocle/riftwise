name: H2H data

# Rebuilds the all-time head-to-head table every 6 hours and publishes it as h2h.json on the
# h2h-data branch. The app downloads it from raw.githubusercontent.com, so H2H records stay
# current between releases.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2h-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build h2h.json
        run: python scripts/h2h/refresh.py out/h2h.json
      - name: Publish to the h2h-data branch
        run: |
          cd out
          git init -q -b h2h-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "H2H data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" h2h-data
