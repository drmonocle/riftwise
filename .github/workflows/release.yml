name: Release

# Builds RiftWise.exe on GitHub's Windows runners from the tagged commit and attaches it, its
# SHA-256 and the zip to a DRAFT release. Review the draft on GitHub, then publish it (that is
# what makes it "Latest" and reaches the in-app updater).
#
#   Tag a release:      git tag v0.3.19 && git push origin v0.3.19
#   Build without tag:  Actions > Release > Run workflow (artifact only, no release)
#
# Code signing (SignPath Foundation) switches on by itself once the repository variable
# SIGNPATH_ORGANIZATION_ID exists; see CODE_SIGNING_POLICY.md. Until then releases are unsigned.
# When it is on, the run pauses at "Sign with SignPath" until the maintainer approves the signing
# request in SignPath, then continues with the signed file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # SignPath reads this run's metadata to verify the build came from this workflow

env:
  SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $v" }

      - name: Frontend checks and build
        run: |
          npm ci
          npm run check:version
          npx tsc --noEmit
          npm test
          npm run build

      - name: Rust tests and release build
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Collect the unsigned exe and check its metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned, release | Out-Null
          Copy-Item src-tauri\target\release\riftwise-tauri.exe unsigned\RiftWise.exe
          $vi = (Get-Item unsigned\RiftWise.exe).VersionInfo
          $want = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "ProductName=$($vi.ProductName) ProductVersion=$($vi.ProductVersion) CompanyName=$($vi.CompanyName) Copyright=$($vi.LegalCopyright)"
          if ($vi.ProductName -ne "RiftWise") { throw "ProductName is '$($vi.ProductName)', expected RiftWise" }
          if ($vi.ProductVersion -ne $want) { throw "ProductVersion is '$($vi.ProductVersion)', expected $want" }

      - name: Upload the unsigned exe
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: RiftWise-unsigned
          path: unsigned/RiftWise.exe
          if-no-files-found: error

      - name: Sign with SignPath (waits for the maintainer's approval)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Package (checksum is computed on the final file)
        shell: pwsh
        run: |
          if ($env:SIGNING -eq 'true') {
            $signed = Get-ChildItem signed -Recurse -Filter RiftWise.exe | Select-Object -First 1
            if (-not $signed) { throw "SignPath returned no RiftWise.exe" }
            $sig = Get-AuthenticodeSignature $signed.FullName
            "Signature: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "The signed file's signature is $($sig.Status), not Valid" }
            Copy-Item $signed.FullName release\RiftWise.exe -Force
          } else {
            Copy-Item unsigned\RiftWise.exe release\RiftWise.exe -Force
          }
          $hash = (Get-FileHash release\RiftWise.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path release\RiftWise.exe.sha256 -Value "$hash  RiftWise.exe" -Encoding ascii -NoNewline
          Compress-Archive -Path release\RiftWise.exe -DestinationPath release\RiftWise-windows-x64.zip -Force
          "RiftWise.exe $([math]::Round((Get-Item release\RiftWise.exe).Length / 1MB, 2)) MB, sha256 $hash, signed=$env:SIGNING"

      - uses: actions/upload-artifact@v7
        with:
          name: RiftWise-windows
          path: |
            release/RiftWise.exe
            release/RiftWise.exe.sha256
            release/RiftWise-windows-x64.zip
          if-no-files-found: error

      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-Content release\RiftWise.exe.sha256 -Raw).Split(' ')[0]
          if ($env:SIGNING -eq 'true') {
            $sig = Get-AuthenticodeSignature release\RiftWise.exe
            $trust = "**Signed.** Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). Signer: ``$($sig.SignerCertificate.Subject)``."
          } else {
            $trust = "**SmartScreen:** RiftWise isn't code-signed yet, so Windows may show ""Windows protected your PC"". Click **More info -> Run anyway**."
          }
          $notes = "Built from $tag by GitHub Actions.`n`n### Checksum`n- ``RiftWise.exe``: ``$hash```n`n$trust"
          gh release create $tag release\RiftWise.exe release\RiftWise.exe.sha256 release\RiftWise-windows-x64.zip --draft --title "RiftWise $tag" --notes $notes
